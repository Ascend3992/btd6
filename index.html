<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Meadow Balloon Defense 3D</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="style.css?v=34" />
</head>
<body>
  <div id="gameWrap">
    <canvas id="game"></canvas>
    <div id="topbar">
      <div class="pill">❤️ <span id="lives">100</span></div>
      <div class="pill">💰 <span id="cash">650</span></div>
      <div class="pill">Round <span id="round">1</span>/100</div>
      <button id="startBtn">Start Round</button>
      <button id="autoBtn">Auto Start: Off</button>
      <button id="speedBtn">Speed ×1</button>
      <button id="restartBtn">Restart</button>
    </div>

    <aside id="shop">
      <h2>Primary Towers</h2>
      <button class="towerBtn" data-tower="dart"><b>Dart Monkey</b><span>$200</span><small>Cheap, reliable darts</small></button>
      <button class="towerBtn" data-tower="boomer"><b>Boomerang Monkey</b><span>$325</span><small>Curved multi-hit attacks</small></button>
      <button class="towerBtn" data-tower="bomb"><b>Bomb Shooter</b><span>$600</span><small>Explosive splash damage</small></button>
      <button class="towerBtn" data-tower="tack"><b>Tack Shooter</b><span>$260</span><small>Radial close-range attacks</small></button>
      <button class="towerBtn" data-tower="ice"><b>Ice Monkey</b><span>$400</span><small>Freezes groups of balloons</small></button>
      <button class="towerBtn" data-tower="glue"><b>Glue Gunner</b><span>$270</span><small>Slows balloons with glue</small></button>
      <hr>
      <h2>Hero</h2>
      <button class="towerBtn hero" data-tower="hero"><b>Quincy</b><span>$540</span><small>Archer hero; levels each round</small></button>
      <div id="hint">Pick a tower, then click the 3D meadow to place it.</div>
    </aside>

    <section id="selectedPanel" class="hidden">
      <div class="selHeader">
        <h3 id="selName"></h3>
        <button id="closeSel" aria-label="Close tower panel">×</button>
      </div>
      <div id="selStats"></div>
      <div id="upgradeGrid">
        <button class="upgradePath top" id="upgrade0"></button>
        <button class="upgradePath middle" id="upgrade1"></button>
        <button class="upgradePath bottom" id="upgrade2"></button>
      </div>
      <div id="upgradeInfo" class="upgradeInfo">Click an upgrade to read what it does.</div>
      <button id="buyUpgradeBtn" class="buyUpgradeBtn" disabled>Buy selected upgrade</button>
      <button id="towerAbilityBtn" class="towerAbilityBtn hidden" type="button"></button>
      <div class="selActions">
        <button id="changeHandsBtn" class="hidden" type="button">Change Hands: Right</button>
        <button id="camoPriorityBtn" class="hidden" type="button" aria-pressed="false">Prioritize Camo: Off</button>
        <button id="targetBtn">Target: First</button>
        <button id="sellBtn">Sell</button>
      </div>
    </section>

    <section id="abilityBar" class="hidden" aria-label="Tower abilities">
      <div class="abilityTitle">Abilities <small>Unlock with upgrades or hero levels</small></div>
      <div id="abilityButtons"></div>
    </section>

    <div id="toast"></div>
    <div id="endScreen" class="hidden">
      <div class="endCard">
        <h1 id="endTitle">Game Over</h1>
        <p id="endText"></p>
        <button onclick="location.reload()">Restart</button>
      </div>
    </div>
  </div>
  <script src="game.js?v=53"></script>
</body>
</html>
